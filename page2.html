<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Regina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    font-family:'Poppins', sans-serif;
    color:#3a2c2c;
    overflow:hidden;
  }

  .stage{
    position:relative;
    display:flex;
    width:100%;
    height:100vh;
  }

  .side-photo{
    flex:1;
    height:100%;
    object-fit:cover;
    filter:saturate(0.85) brightness(0.85);
  }

  .center-photo-wrap{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    height:100%;
    width:42%;
    min-width:280px;
    background:#c23a5e;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .center-photo{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    -webkit-mask-image: radial-gradient(ellipse 68% 94% at 50% 50%, #000 62%, transparent 100%);
            mask-image: radial-gradient(ellipse 68% 94% at 50% 50%, #000 62%, transparent 100%);
  }

  .pink-blur{
    position:absolute;
    top:-10%;
    left:-10%;
    width:120%;
    height:120%;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.15), rgba(226,64,110,0.55) 55%, rgba(180,30,70,0.7) 100%);
    mix-blend-mode:soft-light;
    pointer-events:none;
    z-index:2;
  }

  .center-photo-wrap::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    background:#c23a5e;
    -webkit-mask-image: radial-gradient(ellipse 68% 94% at 50% 50%, #000 62%, transparent 100%);
            mask-image: radial-gradient(ellipse 68% 94% at 50% 50%, #000 62%, transparent 100%);
    opacity:0.25;
    z-index:1;
  }

  .overlay-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:10;
    text-align:center;
    width:90%;
    max-width:520px;
  }

  .date{
    font-family:'Alex Brush', cursive;
    font-size:26px;
    letter-spacing:2px;
    color:#3a2c2c;
    margin-bottom:6px;
  }

  .title{
    font-family:'Alex Brush', cursive;
    font-size:46px;
    line-height:1.2;
    color:#2b2020;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .heart{
    font-size:30px;
  }

  .subtitle{
    font-family:'Poppins', sans-serif;
    font-weight:300;
    font-size:14px;
    letter-spacing:0.5px;
    color:#3a2c2c;
    margin-top:10px;
  }

  .cta{
    position:absolute;
    bottom:8%;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    font-family:'Alex Brush', cursive;
    font-size:22px;
    color:#3a2c2c;
    background:none;
    border:none;
    border-bottom:1px solid rgba(58,44,44,0.7);
    padding-bottom:2px;
    cursor:pointer;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .cta:hover{
    opacity:0.75;
    transform:translateX(-50%) translateY(-2px);
  }

  .fade-in{
    opacity:0;
    animation: fadeIn 1.2s ease forwards;
  }
  .delay-1{ animation-delay:0.3s; }
  .delay-2{ animation-delay:0.7s; }
  .delay-3{ animation-delay:1.1s; }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width: 600px){
    .center-photo-wrap{ width:78%; }
    .title{ font-size:32px; }
    .date{ font-size:20px; }
    .subtitle{ font-size:12px; padding:0 1rem; }
  }
</style>
</head>
<body>

<div class="stage">
  <img class="side-photo" src="couple-glass.jpg" alt="">
  <img class="side-photo" src="couple-green.jpg" alt="">

  <div class="center-photo-wrap">
    <img class="center-photo" src="couple-red.jpg" alt="Foto berdua">
    <div class="pink-blur"></div>
  </div>

  <div class="overlay-text">
    <div class="date fade-in delay-1">07-16-2006</div>
    <div class="title fade-in delay-2">Happy Birthday, Regina <span class="heart">🤍</span></div>
    <div class="subtitle fade-in delay-3">A little gift from me to the person i love -abhirama</div>
  </div>

  <button class="cta fade-in delay-3" id="nextBtn">Click here</button>
</div>

<script>
  document.getElementById('nextBtn').addEventListener('click', function(){
    // arahkan ke halaman berikutnya kalau ada, atau bisa diganti sesuai kebutuhan
    // window.location.href = 'page3.html';
    alert('Yay! Makasih udah klik ❤️');
  });
</script>

</body>
</html>
