<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untukmu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f7f0e6;
    --paper: #fffdf8;
    --ink: #4a3f35;
    --envelope: #f1e0c8;
    --envelope-shadow: #d9c3a0;
    --seal: #b5533c;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background:var(--cream);
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Alex Brush', cursive;
    color:var(--ink);
  }

  .scene{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2.5rem;
    width:100%;
    height:100%;
    padding:2rem;
    text-align:center;
  }

  .top-text{
    font-size:60px;
    line-height:1.1;
    opacity:0;
    animation: fadeIn 1.2s ease forwards 0.2s;
  }

  .bottom-text{
    font-size:30px;
    opacity:0;
    animation: fadeIn 1.2s ease forwards 0.6s;
  }

  /* --- Envelope (photo) --- */
  .envelope-wrap{
    position:relative;
    width:280px;
    max-width:70vw;
    cursor:pointer;
    opacity:0;
    animation: fadeIn 1s ease forwards 0.9s, wiggle 3.5s ease-in-out infinite 2s;
    transform-origin: 50% 85%;
  }

  .envelope-photo{
    display:block;
    width:100%;
    height:auto;
    border-radius:6px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.18);
    transition: transform 0.9s cubic-bezier(.2,.7,.3,1), opacity 0.6s ease, filter 0.3s ease;
  }

  .envelope-wrap:hover .envelope-photo{
    filter: brightness(1.03);
  }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @keyframes wiggle{
    0%, 100% { transform: rotate(0deg); }
    5%  { transform: rotate(-3deg); }
    10% { transform: rotate(2.5deg); }
    15% { transform: rotate(-2deg); }
    20% { transform: rotate(1.5deg); }
    25% { transform: rotate(0deg); }
  }

  .hint{
    font-size:16px;
    font-family: 'Alex Brush', cursive;
    opacity:0;
    animation: fadeIn 1.2s ease forwards 1.4s;
    color:#8a7a68;
  }

  /* opened state */
  .scene.opening .envelope-wrap{
    animation: none;
  }

  .scene.opening .envelope-photo{
    transform: translateY(-30px) scale(1.08) rotate(-1deg);
    opacity:0;
  }

  .scene.opening .top-text,
  .scene.opening .bottom-text,
  .scene.opening .hint{
    animation: none;
    transition: opacity 0.5s ease;
    opacity:0;
  }

  .scene.leaving{
    animation: sceneFade 0.7s ease forwards;
  }

  @keyframes sceneFade{
    to{ opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .envelope-wrap{ animation: fadeIn 1s ease forwards 0.9s !important; }
    .top-text, .bottom-text, .hint{ animation: fadeIn 0.4s ease forwards !important; }
  }

  @media (max-width: 480px){
    .top-text{ font-size:44px; }
    .bottom-text{ font-size:24px; }
  }

  .flower-corner{
    position:absolute;
    bottom:-38px;
    right:-42px;
    width:130px;
    max-width:45%;
    height:auto;
    opacity:0;
    pointer-events:none;
    animation: fadeIn 1.4s ease forwards 1.1s;
    z-index:5;
  }

  .scene.opening .flower-corner,
  .scene.leaving .flower-corner{
    transition: opacity 0.5s ease;
    opacity:0;
  }

  @media (max-width: 480px){
    .flower-corner{ width:90px; bottom:-24px; right:-26px; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="top-text">Untuk Kamu</div>

  <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Buka surat">
    <img class="envelope-photo" src="envelope.jpg" alt="Amplop dengan segel merah">
    <img class="flower-corner" src="flower.png" alt="" aria-hidden="true">
  </div>

  <div class="bottom-text">dengan cinta</div>
  <div class="hint">klik suratnya untuk membuka</div>
</div>

<script>
  const scene = document.getElementById('scene');
  const envelope = document.getElementById('envelope');
  let opened = false;

  function openLetter(){
    if(opened) return;
    opened = true;
    scene.classList.add('opening');

    setTimeout(() => {
      scene.classList.add('leaving');
    }, 900);

    setTimeout(() => {
      window.location.href = 'page2.html';
    }, 1600);
  }

  envelope.addEventListener('click', openLetter);
  envelope.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openLetter();
    }
  });
</script>

</body>
</html>
